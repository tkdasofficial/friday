kind = "mobile"
previewPath = "/"
title = "FRIDAY - AI VoiceBot"
version = "1.0.0"
id = "artifacts/friday"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24291

[services.development]
run = "npm run dev --workspace=@workspace/friday"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/friday" ]
run = [ "npm", "run", "serve", "--workspace=@workspace/friday" ]

[services.env]
PORT = "24291"
BASE_PATH = "/"
